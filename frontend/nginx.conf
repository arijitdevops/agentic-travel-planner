server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API and Server-Sent Events -> FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;          # stream SSE progress events immediately
        proxy_read_timeout 600s;      # agent runs and chat refinements can take minutes
    }

    # Single-page app routing
    location / {
        try_files $uri /index.html;
    }
}
